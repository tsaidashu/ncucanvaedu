<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canva 申請管理後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">

    <!-- 登入畫面 -->
    <div id="loginSection" class="max-w-sm mx-auto bg-white p-8 rounded-xl shadow-md mt-20">
        <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">管理員登入</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">請輸入帳號</label>
                <input type="text" id="adminUser" class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-indigo-500 focus:border-indigo-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">請輸入密碼</label>
                <input type="password" id="adminPass" class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-indigo-500 focus:border-indigo-500 outline-none">
            </div>
            <button id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg">登入</button>
        </div>
    </div>

    <!-- 後台管理畫面 (預設隱藏) -->
    <div id="adminSection" class="max-w-6xl mx-auto hidden">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">教師資格申請名單</h1>
                <p class="text-sm text-gray-500 mt-1">資安機制運作中：標記為已開通後滿 7 天，系統會自動將資料隱碼並反灰。</p>
            </div>
            <button onclick="location.reload()" class="text-sm bg-gray-200 hover:bg-gray-300 py-2 px-4 rounded">登出</button>
        </div>
        
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-indigo-50 text-indigo-800">
                    <tr>
                        <th class="p-4 font-semibold">狀態</th>
                        <th class="p-4 font-semibold">姓名 / 顯示名稱</th>
                        <th class="p-4 font-semibold">單位 / 角色</th>
                        <th class="p-4 font-semibold">Email</th>
                        <th class="p-4 font-semibold">操作</th>
                    </tr>
                </thead>
                <tbody id="dataTable" class="divide-y divide-gray-200">
                    <!-- 資料將由 JS 動態載入 -->
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 替換為您的專屬金鑰
        const firebaseConfig = {
            
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 登入邏輯 (按鈕或按 Enter 鍵)
        const checkLogin = () => {
            if (document.getElementById('adminUser').value === 'ncutldc' && document.getElementById('adminPass').value === 'Tldc@57139') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminSection').classList.remove('hidden');
                loadData();
            } else {
                alert('帳號或密碼錯誤');
            }
        };

        document.getElementById('loginBtn').addEventListener('click', checkLogin);
        document.getElementById('adminPass').addEventListener('keypress', (e) => { if(e.key === 'Enter') checkLogin(); });
        document.getElementById('adminUser').addEventListener('keypress', (e) => { if(e.key === 'Enter') document.getElementById('adminPass').focus(); });

        // 隱碼名字邏輯 (如: 蔡振瑋 -> 蔡O瑋)
        function maskName(name) {
            if (!name) return "";
            if (name.length <= 2) return name.charAt(0) + "O";
            return name.charAt(0) + "O" + name.substring(2);
        }

        // 載入資料庫名單與 7 天自動隱碼機制
        function loadData() {
            const q = query(collection(db, "canva_applications"), orderBy("createdAt", "desc"));
            
            onSnapshot(q, (snapshot) => {
                const table = document.getElementById('dataTable');
                table.innerHTML = '';
                
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const docId = docSnap.id;
                    const now = Date.now();
                    const sevenDaysInMs = 7 * 24 * 60 * 60 * 1000;
                    
                    // 自動隱碼檢查：若已開通、有時間戳記，且大於 7 天，且尚未隱碼
                    if (data.status === 'completed' && data.completedAt && !data.isAnonymized) {
                        if (now - data.completedAt >= sevenDaysInMs) {
                            updateDoc(doc(db, "canva_applications", docId), {
                                name: maskName(data.name),
                                email: data.email.split('@')[0], // 只留帳號
                                isAnonymized: true
                            });
                            return; // 結束這個 loop，等待資料庫更新後觸發下一次 onSnapshot
                        }
                    }

                    // 渲染表格，若已隱碼則套用反灰 (grayscale opacity-60)
                    const rowClass = data.isAnonymized ? "grayscale opacity-60 bg-gray-50" : "hover:bg-gray-50";
                    const statusHtml = data.status === 'completed' 
                        ? `<span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded-full border border-green-200">已開通</span>`
                        : `<span class="bg-amber-100 text-amber-800 text-xs px-2 py-1 rounded-full border border-amber-200">待開通</span>`;
                    
                    // 根據隱碼狀態決定按鈕顯示
                    const actionButton = data.isAnonymized 
                        ? `<span class="text-xs text-gray-400">已歸檔保護</span>`
                        : `<button onclick="toggleStatus('${docId}', '${data.status}')" class="text-sm px-3 py-1 rounded border transition-colors ${
                            data.status === 'completed' 
                            ? 'border-gray-300 text-gray-600 hover:bg-gray-100' 
                            : 'border-indigo-600 text-indigo-600 hover:bg-indigo-50'
                          }">${data.status === 'completed' ? '退回待處理' : '標示為已開通'}</button>`;

                    table.innerHTML += `
                        <tr class="${rowClass} transition-all">
                            <td class="p-4">${statusHtml}</td>
                            <td class="p-4">
                                <div class="font-medium text-gray-800">${data.name}</div>
                                <div class="text-xs text-gray-500">${data.canvaName || '未提供顯示名稱'}</div>
                            </td>
                            <td class="p-4">
                                <div class="text-gray-800">${data.dept}</div>
                                <div class="text-xs text-gray-500">${data.role}</div>
                            </td>
                            <td class="p-4 text-gray-600">${data.email}</td>
                            <td class="p-4">${actionButton}</td>
                        </tr>
                    `;
                });
            });
        }

        // 將切換狀態的函式註冊到全域，供按鈕使用
        window.toggleStatus = async (id, currentStatus) => {
            const newStatus = currentStatus === 'pending' ? 'completed' : 'pending';
            // 若為 completed 則記錄完成的毫秒時間戳記，若退回則清空該紀錄
            const completedAt = newStatus === 'completed' ? Date.now() : null;
            
            await updateDoc(doc(db, "canva_applications", id), {
                status: newStatus,
                completedAt: completedAt
            });
        };
    </script>
</body>
</html>
